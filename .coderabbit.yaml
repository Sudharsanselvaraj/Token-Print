# TokenPrint — CodeRabbit configuration (master reference).
# Review TokenPrint like an LLM scientific visualization and runtime system,
# not a generic web app: scientific correctness + WebGL/GPU lifecycle +
# security + inference correctness + performance before cosmetic concerns.

language: "en-US"

# ── Tone (Reviews + Chat) ──────────────────────────────────────────────────────
tone_instructions: |-
  Professional, concise, technically precise. Prioritize actionable findings and explain why they matter. Be respectful and factual. Avoid marketing language, jokes, emojis, and nitpicking. Distinguish verified behavior from assumptions.

chat:
  art: false # Chat Art: OFF

# ── Code Generation (section 11) ───────────────────────────────────────────────
# Unit-test generation guidance. This is the correct namespace — placing it under
# reviews.path_instructions only affects reviews, not generated tests.
code_generation:
  unit_tests:
    path_instructions:
      - path: "backend/**"
        instructions: |-
          Prefer testing externally observable behavior, validation, edge cases, error handling, tensor shapes/dimensions, model adapter behavior, security-sensitive inputs, and deterministic transformations.
          Do not generate tests that merely assert implementation details.
          Do not fabricate expected tensor values or runtime measurements.
          Reuse existing fixtures and test conventions. Keep tests small, deterministic, and maintainable.
      - path: "frontend/**/{lib,utils,store,hooks}/**"
        instructions: |-
          Focus on reusable frontend logic: state transitions, parsing, data transformations, and deterministic utilities.
          Avoid snapshot-heavy or implementation-detail tests.
          Do not generate tests that require WebGL unless the repository already has an established deterministic test strategy for that code.

reviews:
  # ── General / Review Profile ─────────────────────────────────────────────────
  profile: "chill" # balanced review without excessive nitpicking
  request_changes_workflow: false # CodeRabbit is not the merge authority
  high_level_summary: true

  # ── High Level Summary ──────────────────────────────────────────────────────
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |-
    Create a concise, technical summary for the TokenPrint pull request.

    Use this structure:

    ## What changed
    Summarize the main changes and their purpose.

    ## Technical impact
    Explain affected frontend, backend, model/runtime, 3D/WebGL, security, CI/CD, or documentation behavior when relevant.

    ## Validation
    List meaningful tests, builds, linting, type checks, security checks, and visual regression checks that were actually run or reported by the PR.

    ## Risk
    Mention meaningful regression, compatibility, performance, or security risks when present.

    Keep the summary factual and concise.
    Do not praise the contributor or use marketing language.
    Do not invent test results, measurements, runtime behavior, or implementation details.
    Do not repeat trivial formatting or mechanical changes.
    Do not claim a feature works unless the PR/tests provide evidence.
    For model/scientific changes, distinguish real measurements from estimates, examples, and static/demo data.

  # ── Auto Title (kept OFF; instructions preserved for later) ────────────────
  auto_title_instructions: |-
    Generate concise, descriptive PR titles based on the actual changes.

    Use Conventional Commit style where appropriate:
    feat:
    fix:
    docs:
    refactor:
    perf:
    test:
    ci:
    chore:

    Keep titles under 72 characters.
    Do not invent scope, behavior, or issue references.

  # ── Review / Walkthrough settings ───────────────────────────────────────────
  review_status: true
  review_progress: true
  review_details: true # maintainer visibility: ignored files, context used, suppressed comments
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true # useful for frontend -> API -> runtime -> model flows
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  enable_prompt_for_ai_agents: true # Codex/AI coding agents are used heavily

  # ── Fun (all OFF; senior reviewer, not a chatbot mascot) ────────────────────
  in_progress_fortune: false
  poem: false

  # ── Labeling instructions ───────────────────────────────────────────────────
  # These are SUGGESTION rules (section 4). They are deliberately NOT added to
  # auto_review.labels, which must stay empty so normal PRs targeting `main`
  # are reviewed regardless of labels.
  labeling_instructions:
    - label: "frontend"
      instructions: >
        Suggest this label when a PR primarily changes the Next.js, React,
        TypeScript, UI, routing, state management, browser-side behavior, or
        frontend components.
    - label: "backend"
      instructions: >
        Suggest this label when a PR primarily changes Python, FastAPI, API
        routes, runtime services, model execution, or backend infrastructure.
    - label: "3d"
      instructions: >
        Suggest this label when a PR changes the 3D visualization, Three.js,
        React Three Fiber, scene graph, transformer visualization, camera
        system, controls, 3D labels, or visualization geometry.
    - label: "webgl"
      instructions: >
        Suggest this label when a PR changes WebGL rendering, GPU resources,
        shaders, rendering lifecycle, WebGL contexts, or graphics performance.
    - label: "models"
      instructions: >
        Suggest this label when a PR changes model loading, model adapters,
        Hugging Face integration, GGUF support, model metadata, architecture
        detection, tokenizer handling, or model configuration.
    - label: "inference"
      instructions: >
        Suggest this label when a PR changes inference execution, generation,
        sampling, prefill, decode, logits, token prediction, KV cache, or
        runtime generation state.
    - label: "security"
      instructions: >
        Suggest this label when a PR changes authentication, authorization,
        file uploads, remote URLs, SSRF-sensitive code, path handling,
        subprocess execution, secrets, CORS, dependency security, or GitHub
        Actions security.
    - label: "performance"
      instructions: >
        Suggest this label when a PR materially affects runtime performance,
        memory usage, GPU usage, rendering performance, bundle size, API
        efficiency, model loading performance, or resource lifecycle.
    - label: "research"
      instructions: >
        Suggest this label when a PR changes model-analysis methods,
        mechanistic interpretability, attention analysis, activation analysis,
        ablation, attribution, scientific algorithms, equations, or
        research-oriented functionality.
    - label: "docs"
      instructions: >
        Suggest this label when a PR primarily changes documentation, guides,
        README content, technical explanations, examples, or research
        references.
    - label: "testing"
      instructions: >
        Suggest this label when a PR primarily adds or changes unit tests,
        integration tests, API tests, Playwright tests, visual regression
        tests, fixtures, or test infrastructure.
    - label: "ci"
      instructions: >
        Suggest this label when a PR changes GitHub Actions, CI/CD workflows,
        deployment automation, release automation, repository automation, or
        build pipelines.
    - label: "bug"
      instructions: >
        Suggest this label when the PR fixes an existing defect, regression,
        crash, incorrect behavior, broken workflow, or reproducible issue.
    - label: "feature"
      instructions: >
        Suggest this label when the PR introduces meaningful new user-facing
        or developer-facing functionality.
    - label: "breaking-change"
      instructions: >
        Suggest this label only when the PR intentionally changes a public
        API, data format, configuration contract, CLI behavior, runtime
        contract, or user workflow in a way that can break existing consumers.

  # ── Automatic Review ────────────────────────────────────────────────────────
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - "main"
    # labels: EMPTY — suggestion labels are NOT review-trigger labels.

  # ── Path Filters (section 5: ignore generated artifacts only) ───────────────
  path_filters:
    - "!frontend/out/**"
    - "!frontend/.next/**"
    - "!frontend/playwright-report/**"
    - "!frontend/test-results/**"
    - "!**/node_modules/**"

  # ── Path Instructions (section 6) ───────────────────────────────────────────
  path_instructions:
    - path: "**/*"
      instructions: |
        Review TokenPrint as an LLM visualization, inspection, and runtime project, not as a generic web app.

        Review the system, not just individual files. Evaluate changes in the context of the complete pipeline: frontend UI → state/store → 3D scene → camera/controls → API/WebSocket → backend runtime → model adapter → trace/generation data. Flag regressions caused by state synchronization, stale data, lifecycle mismatches, incorrect model assumptions, or mismatched frontend/backend contracts.

        Classify findings by practical severity:
        - Blocker: exploitable security issue, data corruption, broken core functionality, or severe runtime failure.
        - Major: likely production/user-facing bug, incorrect model behavior, serious performance/resource issue, WebGL/GPU lifecycle leak, or important regression.
        - Minor: localized correctness or maintainability issue with limited impact.
        - Suggestion: improvement that is not required for correctness.
        Do not inflate severity and do not report stylistic preferences as defects.

        For every substantive finding (especially Major/Blocker), explain:
        1. What is wrong
        2. Where it occurs
        3. Why it matters
        4. The concrete impact or failure mode
        5. The evidence from the changed code
        6. A practical recommended fix
        7. Whether a test should be added or updated
        Do not make claims without evidence from the repository. Distinguish confirmed defects from risks, suggestions, and questions.

        For Major/Blocker findings, use this structure:
        ### Finding
        <one-line problem>
        **Why it matters** <actual consequence>
        **Evidence** <what in the diff/code supports this>
        **Recommended fix** <concrete solution>
        **Testing** <existing coverage or suggested regression test>

        When evidence is insufficient for a definitive finding, do not guess. Add a concise "Maintainer check" note describing what assumption needs verification, what evidence is missing, and what test or manual check would resolve it. Use this only for meaningful uncertainty, not trivial questions.

        When a PR references an issue, compare the implementation against the issue requirements: identify requirements satisfied, partially satisfied, not addressed, and behavior added beyond scope. Do not reject a PR merely because it improves something adjacent unless it creates meaningful scope or maintenance risk.

        For substantial PRs, include a brief architectural assessment covering state ownership, lifecycle ownership, API boundaries, component responsibilities, duplicated logic, coupling, future extensibility, and compatibility with existing model adapters and visualization modes. Only report architectural concerns with practical maintenance or correctness impact.

        For each meaningful behavior change, inspect existing tests before recommending new ones. Report tests that already cover the changed behavior, missing coverage that creates realistic regression risk, and the smallest useful test to add. Do not request tests merely to increase coverage numbers.

        Optimize for maintainer signal, not comment count. Do not comment on formatting already enforced by tooling, trivial naming preferences, subjective refactoring, obvious cleanup with no practical impact, or issues already correctly handled by existing CI/tooling. Prefer fewer, higher-confidence findings over many speculative comments.

        For security findings, explain the actual attack/data flow. For performance findings, explain what is expensive, why it happens, when it happens, and the practical impact.

        Per-PR checklist (apply the relevant items):
        CORRECTNESS: does the changed behavior match the intended feature/issue; are edge cases handled; are existing contracts preserved.
        LLM / SCIENCE: tensor dimensions; layer/head/token indices; Q/K/V, GQA, RoPE, RMSNorm, SwiGLU, residual stream, logits, and KV-cache semantics; is model-specific behavior derived from metadata; are real measurements distinguished from fixtures, estimates, or demo values.
        WEBGL / 3D: geometry/material/texture disposal; duplicated WebGL contexts or canvases; animation-frame/timer/listener cleanup; stale camera/OrbitControls state; unnecessary per-frame allocations or rerenders.
        BACKEND / SECURITY: untrusted input validation; file/URL/subprocess/model-ID/path safety; SSRF, path traversal, injection risks; async/resource lifecycles.
        INTEGRATION: do frontend and backend contracts still match; could this break another visualization mode; could this affect deployment, CI, or static builds.
        TESTING: is the changed behavior covered; are regression tests needed; are visual changes covered by Playwright where appropriate.

    - path: "frontend/**/*.{ts,tsx,js,jsx,cjs,mjs}"
      instructions: |
        Focus on React, Next.js, browser, WebSocket, and 3D runtime correctness.
        Check React lifecycle, useEffect cleanup, dependency arrays, stale closures, event listeners, timers, requestAnimationFrame loops, WebSocket lifecycle, async race conditions, duplicated API calls, and production/static-export routing behavior.
        For Three.js/WebGL code, check geometry/material/texture disposal, R3F object lifetime, duplicate Canvas or scene mounts, duplicate WebGL contexts, unnecessary allocations every frame, excessive React rerenders around animation state, camera ownership, OrbitControls conflicts, camera-follow state, HTML/3D overlay stacking, and portal/modal isolation.
        Do not suggest theoretical rendering optimizations unless there is a concrete repeated allocation, rerender, lifecycle leak, or measurable user impact.

    - path: "frontend/components/scenes/**/*"
      instructions: |
        Treat scene changes as high-risk. Verify object lifetime, memoization, animation loops, effect cleanup, material/geometry reuse, frame-by-frame allocations, camera coordination, controls ownership, and accurate mapping from model/runtime data to visual state.
        Flag visualizations that imply real model measurements when they are demo, static, estimated, or heuristic values.

    - path: "frontend/lib/**/*"
      instructions: |
        Review store slices, API clients, websocket utilities, GGUF parsing/dequantization, execution graph logic, timing, and model metadata transformations for state consistency and scientific correctness.
        Check tensor dimensions, Q/K/V projections, GQA semantics, RoPE, RMSNorm, SwiGLU, residual stream behavior, LM head/logits mapping, token ID mappings, KV-cache behavior, prefill/decode transitions, and layer indexing.
        When a constant appears model-specific, verify whether it should be derived from backend metadata or model configuration instead.

    - path: "backend/**/*.{py,yml,yaml}"
      instructions: |
        Review FastAPI lifecycle, request validation, async correctness, resource cleanup, concurrency, memory growth, model loading, Hugging Face model IDs, GGUF uploads, external URLs, path handling, temporary files, CORS, subprocess calls, and shell invocation.
        Prioritize SSRF, path traversal, unsafe file extraction/loading, arbitrary code execution through model artifacts, secrets exposure, and dependency changes.
        For model/runtime code, verify API contracts, tensor shapes, layer indexing, KV-cache consistency, prefill/decode state, logits/token mapping, and adapter-specific metadata.

    - path: "backend/app/inference/**/*"
      instructions: |
        Treat inference adapters and backends as high-risk. Check that model-specific behavior is isolated in the correct adapter, dimensions come from configuration or metadata, and generic fallbacks do not silently fabricate unsupported model behavior.
        Flag mismatches between adapter contracts, backend runtime output, API schemas, and frontend expectations.

    - path: "backend/tests/**/*"
      instructions: |
        Check tests for meaningful coverage of security guards, API contracts, model adapter behavior, GGUF handling, SSRF prevention, and failure paths.
        Avoid test-style nits unless they obscure correctness or make regressions likely.

    - path: ".github/workflows/**/*.{yml,yaml}"
      instructions: |
        Review GitHub Actions for least-privilege permissions, safe pull_request versus pull_request_target usage, untrusted input handling, secret exposure, pinned or trusted actions, shell injection, unsafe checkout/ref handling, and deployment safety.
        Keep deterministic CI, CodeQL, Dependabot, Playwright visual regression, and the existing Gemini review workflow distinct from CodeRabbit's role as the primary PR reviewer.

    - path: "docs/**/*.md"
      instructions: |
        Review technical and scientific claims for accuracy. Distinguish real runtime data, static/demo data, and derived or estimated values.
        Flag unsupported claims, fabricated measurements, stale API behavior, misleading model statements, or documentation that presents illustrative data as live inference.

    - path: "fixtures/**/*"
      instructions: |
        Verify fixtures are clearly treated as static/demo data and are not mistaken for live runtime measurements.
        Do not request exclusion of fixtures unless they are generated build artifacts; they are part of TokenPrint's test and scientific-integrity surface.

  # ── Anti-Slop (section 15) ──────────────────────────────────────────────────
  slop_detection:
    enabled: true
    include_all_authors: true
    label: "needs-review"

  # ── Finishing Touches (section 11) ──────────────────────────────────────────
  finishing_touches:
    docstrings:
      enabled: false # on-demand only; avoid misleading generated docstrings
    unit_tests:
      enabled: true # selective; per-path guidance lives in code_generation.unit_tests.path_instructions

  # ── Pre-Merge Checks (section 10) ───────────────────────────────────────────
  pre_merge_checks:
    docstrings:
      mode: warning # not a hard error
      threshold: 60
    title:
      mode: error
      requirements: |-
        PR title must be concise, descriptive, and explain the primary change.

        Prefer the repository's existing conventional commit style where applicable, for example:

        feat: add attention visualization
        fix: repair camera follow state
        docs: update GGUF documentation
        chore: update CI workflow

        Avoid vague titles such as:
        "Update"
        "Changes"
        "Fix stuff"
        "New things"

        Keep titles ideally under 72 characters.
    description:
      mode: warning
    issue_assessment:
      mode: warning
    # Custom pre-merge checks: NONE — CI, CodeQL, and Playwright already cover this.
    custom_checks: []

  # ── Post-Merge Actions (section 12): NONE ──────────────────────────────────
  # TokenPrint already has deploy/release/contributor/wiki/roadmap automation.

  # ── Tools (additional review context) ───────────────────────────────────────
  tools:
    eslint:
      enabled: true
    ruff:
      enabled: true
    semgrep:
      enabled: true
    opengrep:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    github-checks:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    yamllint:
      enabled: true
