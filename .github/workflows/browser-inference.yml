name: Browser inference reference
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_DISABLE_BASEPATH: '1'
      - name: Serve production export and verify real WASM inference
        working-directory: frontend
        env:
          TOKENPRINT_BROWSER_INFERENCE: '1'
        run: |
          python3 -m http.server 3000 --directory out &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/visual/browser-inference.spec.ts --project=chromium --grep wasm
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-inference-failure
          path: frontend/test-results/
