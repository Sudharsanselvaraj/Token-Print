name: "🔎 Gemini Code Review & Quality Gate"

# NOTE: This workflow uses the free-tier Gemini API via
# derailed-dash/gemini-review-action@v1. Rate limits are expected under heavy
# PR volume — re-trigger manually with /gemini-review in a PR comment.
#
# Required secret: GEMINI_API_KEY

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  review:
    name: Gemini PR review
    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      checks: write

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request && github.event.pull_request.head.sha || github.sha }}

      - name: Run Gemini PR review
        id: gemini
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        if: env.GEMINI_API_KEY != ''
        uses: derailed-dash/gemini-review-action@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          language: "English"

      - name: Retry Gemini PR review on transient API error
        id: gemini_retry
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        if: env.GEMINI_API_KEY != '' && steps.gemini.outcome == 'failure'
        uses: derailed-dash/gemini-review-action@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          language: "English"

      - name: Evaluate Gemini Quality Gate Verdict
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const prSha = context.payload.pull_request
              ? context.payload.pull_request.head.sha
              : (context.payload.issue && context.payload.issue.pull_request ? (await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.issue.number
                })).data.head.sha : context.sha);

            const prNumber = context.payload.pull_request
              ? context.payload.pull_request.number
              : (context.payload.issue ? context.payload.issue.number : null);

            if (!prNumber) return;

            const hasKey = !!process.env.GEMINI_API_KEY;

            if (!hasKey) {
              try {
                await github.rest.repos.createCommitStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  sha: prSha,
                  state: 'success',
                  context: 'Gemini PR Quality Gate',
                  description: 'Gemini Quality Gate: Skipped for automated Dependabot/fork PR',
                });
                console.log(`Commit status set to success (skipped - no secret) for SHA ${prSha}`);
              } catch (err) {
                console.warn(`Skipped setting commit status (fork PR without write access to upstream statuses): ${err.message}`);
              }
              return;
            }

            // Fetch recent comments on the PR to find Gemini's review verdict
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 20
            });

            const lastVerdictComment = comments
              .reverse()
              .find(c => c.body && c.body.includes('VERDICT:'));

            let state = 'success';
            let description = 'Gemini Quality Gate: Approved (VERDICT: APPROVE)';

            if (lastVerdictComment) {
              const body = lastVerdictComment.body;
              if (body.includes('VERDICT: CHANGES_REQUESTED')) {
                state = 'failure';
                description = 'Gemini Quality Gate: Rejected (VERDICT: CHANGES_REQUESTED)';
              } else if (body.includes('VERDICT: MAINTAINER_REVIEW')) {
                state = 'success';
                description = 'Gemini Quality Gate: Requires Maintainer Review';
              } else if (body.includes('VERDICT: APPROVE')) {
                state = 'success';
                description = 'Gemini Quality Gate: Approved (VERDICT: APPROVE)';
              }
            }

            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: prSha,
                state: state,
                context: 'Gemini PR Quality Gate',
                description: description,
              });
              console.log(`Commit status set to ${state} for SHA ${prSha}: ${description}`);
            } catch (err) {
              console.warn(`Could not set commit status (fork PR without write access to upstream statuses): ${err.message}`);
            }
