name: Update contributors grid

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh README contributors grid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXCLUDED_CONTRIBUTORS: "copilot,copilot-coding-agent"
        run: python scripts/update_contributors_grid.py --repo "${{ github.repository }}" --readme README.md

      - name: Commit and push updates
        run: |
          if git diff --quiet README.md; then
            echo "No contributor changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): refresh contributors grid"
          git push
