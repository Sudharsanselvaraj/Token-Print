name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `next build` type-checks the whole tree and runs ESLint, so a green
      # build is the real gate. It needs no backend — the app is env-driven.
      - name: Build (type-check + lint + compile)
        run: npm run build

  backend:
    name: Backend · syntax & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Byte-compile only: catches syntax errors without installing PyTorch or
      # downloading the ~1GB model (too heavy/flaky for CI). The real forward-pass
      # verification scripts are meant to be run locally against the live model.
      - name: Byte-compile
        run: python -m compileall -q backend/app backend/scripts

      - name: Lint (ruff)
        run: |
          python -m pip install --quiet ruff==0.16.7
          ruff check backend/app backend/scripts backend/tests

  # Hermetic API regression guard (ENG-21): importing app.main pulls in PyTorch,
  # so we install the CPU wheel and run only the no-network, no-model smoke tests.
  backend-smoke:
    name: Backend · API smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test deps (CPU torch)
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet "fastapi>=0.110" "uvicorn[standard]" websockets numpy scikit-learn pytest python-multipart pyyaml

      # No model, no network: verifies core routes never 5xx and the HF SSRF
      # guard rejects hostile inputs. Introduced after /analyze shipped a 500.
      - name: Run API smoke + HF guard tests
        run: python -m pytest tests/test_api_smoke.py tests/test_hf_guard.py tests/test_api_hf.py -q
