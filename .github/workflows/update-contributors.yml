name: "🧑‍🤝‍🧑 Update Contributors"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate contributors table
        id: update
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const { data: contributors } = await github.rest.repos.listContributors({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
              anon: false,
            });

            const rows = contributors
              .filter((c) => c.type === 'User' && !c.login.endsWith('[bot]'))
              .map((c) =>
                `| [![${c.login}](https://github.com/${c.login}.png?size=48)]` +
                `(https://github.com/${c.login}) | [${c.login}]` +
                `(https://github.com/${c.login}) | ${c.contributions} |`
              )
              .join('\n');

            const start = '<!-- CONTRIBUTORS:START -->';
            const end = '<!-- CONTRIBUTORS:END -->';
            const block = `${start}\n${rows}\n${end}`;

            let readme = fs.readFileSync('README.md', 'utf8');
            if (!readme.includes(start)) {
              console.log('Contributors markers not found in README.md; skipping update.');
              return;
            }

            const next = readme.replace(new RegExp(`${start}[\\s\\S]*?${end}`), block);
            if (next === readme) {
              console.log('README contributors table unchanged; nothing to commit.');
              return;
            }

            fs.writeFileSync('README.md', next);
            console.log('README.md updated with fresh contributor list.');

      - name: Open PR with updated contributors and auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "No README changes; nothing to do."
            exit 0
          fi

          # main is branch-protected (required status checks), so the bot can't
          # push to it directly. Ship the README update through a PR instead and
          # auto-merge it once the required checks pass.
          BRANCH="chore/contributors-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "chore: auto-update contributors in README"
          git push -u origin "$BRANCH" --quiet

          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore: auto-update contributors in README" \
            --body "Auto-generated by the **Update Contributors** workflow. This README-only change refreshes the contributor table from the GitHub contributors API.")
          echo "Opened $PR_URL"
          gh pr merge "$PR_URL" --auto --merge --delete-branch=false