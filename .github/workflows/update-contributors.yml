name: "🧑‍🤝‍🧑 Update Contributors"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-contributors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CONTRIBUTORS_TOKEN }}
          fetch-depth: 0

      - name: Generate contributor poster
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_contributor_poster.py

      - name: Open PR with updated contributor poster
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTORS_TOKEN }}
        run: |
          git config user.name "Sudharsanselvaraj"
          git config user.email "178299750+Sudharsanselvaraj@users.noreply.github.com"
          git add .github/assets/contributors.png
          if git diff --cached --quiet; then
            echo "Contributor poster unchanged; nothing to do."
            exit 0
          fi
          git commit -m "chore: refresh contributor poster"

          BRANCH="ci/update-contributors"
          git push --quiet --force origin "HEAD:$BRANCH"
          PR_NUMBER="$(
            gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty'
          )"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore: refresh contributor poster" \
              --body "Refreshes the contributor poster from GitHub's human contributor list."
          fi
          gh pr merge --auto --squash --delete-branch "$BRANCH"
