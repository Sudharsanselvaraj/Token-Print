name: "🎨 Visual Regression — 3D scenes"

# Triggered only on PRs that touch 3D scene code or core lib — expensive test,
# don't run it on every PR.
on:
  pull_request:
    paths:
      - "frontend/components/scenes/**"
      - "frontend/lib/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-regression:
    name: Playwright visual regression
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    steps:
      - uses: actions/checkout@v4

      # ── Backend setup ──────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Qwen2.5-0.5B weights
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-qwen2.5-0.5b-instruct-v1
          restore-keys: |
            hf-qwen2.5-0.5b-instruct-

      - name: Install backend requirements
        run: |
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install fastapi uvicorn websockets numpy transformers==4.51.3 scikit-learn==1.5.1 python-multipart

      - name: Start backend
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --app-dir . --port 8000 &
          # Wait until the backend is healthy (up to 120 s for model load).
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/architecture && echo "backend ready" && break
            sleep 2
          done

      # ── Frontend setup ────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        env:
          # Static export with no basePath so the app is served at "/" —
          # otherwise `basePath: /repo` shifts everything under /Token-Print
          # and the Playwright tests (which use page.goto("/")) 404.
          GITHUB_REPOSITORY: ""
        run: npm run build

      - name: Start frontend (static export server)
        working-directory: frontend
        run: |
          # `next start` is unavailable for `output: export`; serve the
          # static export directly.
          python3 -m http.server 3000 --directory out &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ && echo "frontend ready" && break
            sleep 2
          done

      # ── Run visual tests ──────────────────────────────────────────────────
      - name: Run Playwright visual tests
        id: playwright
        working-directory: frontend
        run: npx playwright test
        continue-on-error: true

      # ── Upload artifacts and comment on PR ────────────────────────────────
      - name: Upload Playwright report and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Post PR comment with report link
        if: steps.playwright.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## ⚠️ Visual regression tests failed',
              '',
              `The Playwright visual regression suite detected differences in the 3D scenes.`,
              '',
              `**[View the full Playwright report and diff images](${runUrl})**`,
              '',
              'To update baselines after an intentional change:',
              '```bash',
              'cd frontend && npx playwright test --update-snapshots',
              '```',
              'Then commit the updated snapshot files.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # Non-blocking on purpose: this is a reporting/QA aid, not a required
      # status check (see branch protection: only Frontend type-check & build
      # and Backend syntax & lint gate merges). Baselines are platform-specific
      # (playwright suffixes -linux/-darwin) and the suite currently targets
      # the pre-v2 default UI, so failing runs comment + upload artifacts rather
      # than turning PRs red.
