# Roadmap → GitHub Issues manifest.
#
# Every unschopped / parked / contribution-ready roadmap item lives here once,
# and `scripts/sync-roadmap.py` (run by .github/workflows/roadmap-sync.yml and
# locally) turns it into a GitHub issue with the configured labels/milestone.
# The script is idempotent: it only creates issues whose title does not exist
# (open or closed), so editing this file never produces duplicates.
#
# Fields per item:
#   id        — stable identifier, also used in the tracker report
#   title     — must be unique among issues in the repo
#   body      — Markdown body (put real details here, verbatim roadmap text below)
#   labels    — GitHub labels to apply (script skips labels that don't exist)
#   milestone — GitHub milestone title to attach (script creates it if missing)
#   source    — where the idea lives in the repo docs
#   roadmap_text — verbatim quote from ROADMAP.md / wiki so the ticket is traceable

tracker:
  title: "🗺️ Roadmap → Issues sync"
  created_by: "roadmap-sync"

milestones:
  - "Phase 5 — Platform & flagship visuals"
  - "Phase 5 — Platform & flagship visuals (Parked)"

items:
  - id: PARKED-LLAMACPP
    title: "PARKED: Real quantized GGUF execution via llama.cpp integration"
    labels: [enhancement]
    milestone: "Phase 5 — Platform & flagship visuals (Parked)"
    source: "ROADMAP.md §5"
    roadmap_text: |- 
      Real quantized GGUF execution (llama.cpp integration).
    body: |
      ## Deliberately parked — see ROADMAP.md §5

      Run *real* quantized inference against uploaded GGUF files via native
      [`llama.cpp`](https://github.com/ggml-org/llama.cpp) bindings, instead of
      the current metadata-only GGUF loading.

      - **Why it's parked**: tough packaging (platform-specific wheels for
        `llama-cpp-python`), heavy binary payloads in CI, and the WebGPU
        client-side route (#84) is the more promising long-term direction.
      - **If you pick this up**: start with `backend/app/gguf_engine.py` and the
        optional-dependency story in `backend/requirements-gguf.txt`, then add a
        real dequantized forward path behind the GGUF visualizations.

      **Verification**: load a real Q4_K_M GGUF and see live generated tokens
      from the file in the Generation view.
  - id: PARKED-SIDEBYSIDE
    title: "PARKED: Side-by-side live model comparison (two resident models)"
    labels: [enhancement]
    milestone: "Phase 5 — Platform & flagship visuals (Parked)"
    source: "ROADMAP.md §5"
    roadmap_text: |-
      Side-by-side live model comparison (two resident models).
    body: |
      ## Deliberately parked — see ROADMAP.md §5

      Load two models in one session and generate the same prompt through both,
      comparing attention/activations side-by-side.

      - **Why it's parked**: memory cost of a second resident model and full
        engine-state serialization; the existing single-model engine would need
        a contexts/instances abstraction first (see ENG-14 ModelAdapter).
      - **Related but live**: cross-quantization drift analysis (#116) is the
        lighter-weight version of this.

      **Verification**: launch the dev server, load model A and model B, then
      run the same sentence through both and diff the attention row for layer N.
  - id: PARKED-FLAMEGRAPH
    title: "PARKED: Full memory-byte profiling / flame-graph profiler"
    labels: [enhancement]
    milestone: "Phase 5 — Platform & flagship visuals (Parked)"
    source: "ROADMAP.md §5"
    roadmap_text: |-
      Full memory-byte profiling / flame-graph profiler.
    body: |
      ## Deliberately parked — see ROADMAP.md §5

      A byte-level memory profiler that records KV-cache + parameter memory per
      layer over the forward pass and renders it as a flame graph.

      - **Why it's parked**: PyTorch memory instrumentation is fragile across
        versions, and the user-facing demand is low while `v0.4`-era debugger
        features remain unpolished.
      - **Seed already exists**: the KV-cache memory timeline shipped in v2
        gives us the capture layer to build on.

      **Verification**: run one forward pass and export a flame-graph JSON
      renderable in the frontend.
  - id: PARKED-SAE
    title: "PARKED: SAE / learned-feature browsing and steering"
    labels: [enhancement]
    milestone: "Phase 5 — Platform & flagship visuals (Parked)"
    source: "ROADMAP.md §5"
    roadmap_text: |-
      SAE / learned-feature browsing and steering.
    body: |
      ## Deliberately parked — see ROADMAP.md §5

      Browse sparse-autoencoder learned features on a hidden layer and steer
      generation by boosting/suppressing the active features.

      - **Why it's parked**: SAE weights are model-specific and expensive to
        produce; we explicitly positioned as "no SAE required" for the v0.5
        interventions milestone.
      - **Related**: induction-head lab (ROADMAP §7 #6) is a lighter first step.

      **Verification**: attach a pre-trained SAE checkpoint for Qwen2.5-0.5B and
      steer a top-k feature during greedy generation.
  - id: PARKED-TUNEDLENS
    title: "PARKED: Tuned-Lens-grade logit lens by default"
    labels: [enhancement]
    milestone: "Phase 5 — Platform & flagship visuals (Parked)"
    source: "ROADMAP.md §5"
    roadmap_text: |-
      Tuned-Lens-grade logit lens by default.
    body: |
      ## Deliberately parked — see ROADMAP.md §5

      Replace the raw (unadjusted) logit lens with a [Tuned-Lens](https://github.com/AlignmentResearch/tuned-lens)-style
      calibrated lens that removes the basis-drift artifact.

      - **Why it's parked**: tuned-lens requires per-model fitted probes for the
        vocabulary-bias calibration; raw lens is shipped today with the
        "unadjusted" caveat documented.
      - **Seed already exists**: the raw lens panel + token evolution timeline
        shipped already; this swaps the projection matrices.

      **Verification**: logit-lens heatmap no longer shows the pervasive
      "next-token drift" column; calibrated decoder labels visible.
